{% extends "base.html" %}
{% set prompt = page.prompt.replace("{url}", absolute(page.url ~ "index.md")) %}
{% block content %}
<article class="tool page">
  <a class="back" href="{{ url('') }}#tools">← all tools</a>
  <h1>{{ page.heading }}</h1>
  <p class="lede">{{ page.lede | safe }}</p>

  <div class="cmd primary prompt-box">
    <span class="cmd-label">prompt</span>
    <code class="cmd-text">{{ prompt }}</code>
    <button class="copy" type="button" data-copy="{{ prompt }}" aria-label="Copy short prompt">copy</button>
  </div>
  <p class="muted small">Agent can't fetch URLs? <button class="copy inline" type="button" data-copy-target="page-prompt">copy the full prompt</button> instead.</p>
  <pre id="page-prompt" hidden>{{ page.source }}</pre>

  <section class="prose">
    {{ page.body }}
  </section>
</article>
{% endblock %}
