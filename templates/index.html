{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>{{ site.tagline }}</h1>
  <p>{{ site.description }}</p>
</section>

<section id="projects" class="grid">
  {% for p in projects %}
  <a class="card{% if p.featured %} featured{% endif %}" href="{{ site.base_url }}{{ p.href }}">
    <h2>{{ p.title }}</h2>
    <p>{{ p.summary }}</p>
    <div class="meta">
      {% if p.date %}<time datetime="{{ p.date }}">{{ p.date.strftime("%b %Y") }}</time>{% endif %}
      {% for t in p.tags %}<span class="tag">{{ t }}</span>{% endfor %}
    </div>
  </a>
  {% endfor %}
</section>
{% endblock %}
