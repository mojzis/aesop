<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page_title %}{{ page_title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.base_url }}/static/css/main.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ site.base_url }}/">{{ site.title }}</a>
    <nav>
      <a href="{{ site.base_url }}/#projects">Projects</a>
      {% for name, url in site.links.items() %}
      <a href="{{ url }}" target="_blank" rel="noopener">{{ name }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>© {{ year }} {{ site.author }}</span>
  </footer>
  <script src="{{ site.base_url }}/static/js/main.js" defer></script>
</body>
</html>
