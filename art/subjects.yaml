ty-find: >-
  a Philippine tarsier clinging to a thin vertical branch, enormous round eyes, long fingers
biston: >-
  a peppered moth (Biston betularia), dorsal view, wings spread flat, speckled white and black
dermestes: >-
  a skin beetle (Dermestes lardarius), dorsal view, dark brown with a pale speckled band across the wing cases, six legs and clubbed antennae spread
zorilla: >-
  a striped polecat, zorilla (Ictonyx striatus), side view, black with four white stripes down the back and a bushy white tail
pycoati: >-
  a ring-tailed coati (Nasua nasua), side view, walking, long snout, ringed tail held straight up
gerenuk: >-
  a gerenuk (Litocranius walleri) antelope, side view, standing, very long slender neck, lyre-shaped horns
madoqua: >-
  a dik-dik (Madoqua kirkii), tiny antelope, side view, standing, large dark eye, short spike horns, elongated snout
introspect: >-
  a little owl (Athene noctua) perched on a short stump, facing the viewer, yellow eyes
lepisma: >-
  a silverfish (Lepisma saccharina), dorsal view, tapered silvery-grey scaled body, two long antennae
  and three long tail bristles
