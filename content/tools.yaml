  order: 70

- id: pycoati
  name: pycoati
  animal: coati
  accent: "#a0522d"
  tagline: Tells your agent which tests to fix first.
  reach_for_it: >
    Every now and then, not every commit. The suite is green but you don't
    trust it. Walks the whole suite, optionally runs pytest for durations and
    coverage, scores every test for suspicion, and hands your agent a ranked
    list plus a remediation ladder. For the per-commit gate, see
    [zorilla](../zorilla/).
  guide: uvx pycoati@latest guide
  install: uvx pycoati@latest
  category: guardrails
  links:
    repo: https://github.com/mojzis/pycoati
    pypi: https://pypi.org/project/pycoati/
  order: 45
