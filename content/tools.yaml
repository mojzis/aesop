- id: ty-find
  name: ty-find
  animal: tarsier
  honorary: true
  accent: "#a78bfa"
  tagline: Find the symbol, not 400 grep hits.
  reach_for_it: >
    Your agent needs definitions and references in a large repo — LSP-accurate
    answers at CLI speed, without the token bonfire of `grep -rn`.
  guide: uvx ty-find@latest guide
  install: uvx ty-find@latest
  category: workflow
  links:
    repo: https://github.com/mojzis/ty-find
    docs: https://mojzis.github.io/ty-find/
    pypi: https://pypi.org/project/ty-find/
  order: 10

- id: biston
  name: biston
  animal: peppered moth
  accent: "#b8a48a"
  tagline: Finds the code your agent wrote twice.
  reach_for_it: >
    The repo grew fast and you suspect three slightly different copies of the
    same helper. Structural detection via tree-sitter, so renamed variables
    don't fool it.
  guide: uvx biston@latest guide
  install: uvx biston@latest
  category: guardrails
  links:
    repo: https://github.com/mojzis/biston
    docs: https://mojzis.github.io/biston/
    pypi: https://pypi.org/project/biston/
  order: 30

- id: dermestes
  name: dermestes
  animal: skin beetle
  accent: "#e9e4d4"
  tagline: Strips abstractions down to the ones that earned their keep.
  reach_for_it: >
    Your agent just added an ABC with one implementation, a parameter nobody
    overrides and a wrapper that only forwards its arguments. Reports what
    your diff introduced as deletion candidates, each ending in a `suggest:`
    line the agent can apply. `--all` for the full audit.
  guide: uvx dermestes@latest guide
  install: uvx dermestes@latest
  category: guardrails
  links:
    repo: https://github.com/mojzis/dermestes
    docs: https://mojzis.github.io/dermestes/
    pypi: https://pypi.org/project/dermestes/
  order: 35

- id: zorilla
  name: zorilla
  animal: striped polecat
  accent: "#e5ff4a"
  tagline: Sniffs out tests that test nothing.
  reach_for_it: >
    Every commit. An agent just proudly delivered 40 green tests and you want
    to know how many actually assert something. Eight fast syntactic rules —
    no assertion, sleep, patch stacks — as a pre-commit hook. Says yes or no,
    then gets out of the way. For the full ranked audit, see
    [pycoati](../pycoati/).
  guide: uvx zorilla@latest guide
  install: uvx zorilla@latest
  category: guardrails
  links:
    repo: https://github.com/mojzis/zorilla
    pypi: https://pypi.org/project/zorilla/
  order: 40

- id: lepisma
  name: lepisma
  animal: silverfish
  accent: "#c3ccd6"
  tagline: Nibbles at the prose your agent padded.
  reach_for_it: >
    Your agent writes the docs too, and they read like it: 31-word sentences,
    noun stacks, "leverage". Soft warnings on staged Markdown, one per line,
    for the agent to rewrite. Never blocks a commit, and stays silent rather
    than slow.
  guide: uvx lepisma@latest guide
  install: uvx lepisma@latest check docs/
  category: guardrails
  links:
    repo: https://github.com/mojzis/lepisma
    pypi: https://pypi.org/project/lepisma/
  order: 48

- id: gerenuk
  name: gerenuk
  animal: gerenuk
  accent: "#d98c4a"
  tagline: Runs only the tests your diff can touch.
  reach_for_it: >
    You want tests in the pre-commit hook without colleagues hating you —
    diff → changed symbols → impacted tests, in seconds.
  guide: uvx gerenuk@latest guide
  install: uvx gerenuk@latest
  category: workflow
  links:
    repo: https://github.com/mojzis/gerenuk
    docs: https://mojzis.github.io/gerenuk/
    pypi: https://pypi.org/project/gerenuk/
  order: 50

- id: madoqua
  name: madoqua
  animal: dik-dik
  accent: "#e0b98a"
  tagline: The commit hook that's silent when you're fine and precise when you're not.
  reach_for_it: >
    You're done with noisy hook runners — auto-fixes, restages, one-line
    verdict on success, dense token-aware output on failure.
  guide: uvx madoqua@latest guide
  install: uvx madoqua@latest
  category: workflow
  links:
    repo: https://github.com/mojzis/madoqua
    docs: https://mojzis.github.io/madoqua/
    pypi: https://pypi.org/project/madoqua/
  order: 60

- id: introspect
  name: introspect
  animal: owl
  honorary: true
  accent: "#5b7cff"
  tagline: What did your agent actually do all day?
  reach_for_it: >
    You want to query your Claude Code sessions with SQL — costs, tool calls,
    patterns, the works.
  guide: uvx introspy@latest guide
  install: uvx introspy@latest
  category: meta
  links:
    repo: https://github.com/mojzis/introspect
    pypi: https://pypi.org/project/introspy/
  order: 70

- id: pycoati
  name: pycoati
  animal: coati
  accent: "#a0522d"
  tagline: Tells your agent which tests to fix first.
  reach_for_it: >
    Every now and then, not every commit. The suite is green but you don't
    trust it. Walks the whole suite, optionally runs pytest for durations and
    coverage, scores every test for suspicion, and hands your agent a ranked
    list plus a remediation ladder. For the per-commit gate, see
    [zorilla](../zorilla/).
  guide: uvx pycoati@latest guide
  install: uvx pycoati@latest
  category: guardrails
  links:
    repo: https://github.com/mojzis/pycoati
    pypi: https://pypi.org/project/pycoati/
  order: 45
