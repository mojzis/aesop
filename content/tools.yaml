  guide: uvx gerenuk@latest guide
  install: uvx gerenuk@latest
  category: workflow
  links:
    repo: https://github.com/mojzis/gerenuk
    docs: https://mojzis.github.io/gerenuk/
    pypi: https://pypi.org/project/gerenuk/
  order: 50

- id: madoqua
  name: madoqua
  animal: dik-dik
  accent: "#e0b98a"
  tagline: The commit hook that's silent when you're fine and precise when you're not.
  reach_for_it: >
    You're done with noisy hook runners — auto-fixes, restages, one-line
    verdict on success, dense token-aware output on failure.
  guide: uvx madoqua@latest guide
  install: uvx madoqua@latest
  category: workflow
  links:
    repo: https://github.com/mojzis/madoqua
    docs: https://mojzis.github.io/madoqua/
    pypi: https://pypi.org/project/madoqua/
  order: 60

- id: introspect
  name: introspect
  animal: owl
  honorary: true
  accent: "#5b7cff"
  tagline: What did your agent actually do all day?
  reach_for_it: >
    You want to query your Claude Code sessions with SQL — costs, tool calls,
    patterns, the works.
  guide: uvx introspy@latest guide
  install: uvx introspy@latest
  category: meta
  links:
    repo: https://github.com/mojzis/introspect
