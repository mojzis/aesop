title: aesop
tagline: A small menagerie of fast tools that keep agentic Python development honest.
tagline_alt: Agents write code fast. These keep it from going feral.
pitch: Every tool here teaches your agent itself — just say
pitch_cmd: run `uvx <tool>@latest guide`
description: Fast CLI tools for agentic Python development. Each one teaches your agent how to use it.
author: "@mojzis"
author_url: https://github.com/mojzis
base_url: https://mojzis.github.io/aesop
links:
  GitHub: https://github.com/mojzis
categories:
  guardrails: Guardrails
  workflow: Workflow
  meta: Meta
pages:
  - id: setup
    nav: Setup
    title: Add all of them at once
    page_title: setup prompt
    description: One prompt that wires the whole aesop toolbox into a repo.
    lede: Paste this into your agent. It wires the whole menagerie in three tiers and only calls a tool's <code>guide</code> when it needs the details.
    prompt: "Set up the aesop toolbox: follow {url}"
  - id: guide
    nav: Guide
    title: Every tool teaches itself
    page_title: the guide principle
    description: Why every aesop tool ships a guide subcommand, the contract it follows, and a prompt to add one to any CLI.
    lede: <code>&lt;tool&gt; guide</code> prints one page written for the agent about to use it. Here is the contract, and a prompt that adds it to a CLI you own.
    prompt: "Add a `guide` subcommand to this CLI: follow {url}"
