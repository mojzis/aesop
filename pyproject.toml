[project]
name = "aesop"
version = "0.1.0"
description = "Static portfolio site generated with Python + Jinja2"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "biston>=0.7.0",
    "gerenuk>=0.1.0",
    "introspy>=0.3.1",
    "madoqua>=0.1.0",
    "pycoati>=0.2.4",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "ty-find>=0.4.5",
    "zorilla>=0.1.4",
]

[project.scripts]
build = "build.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # staged files become --focus-args focus files: only clone pairs touching them are reported.
    { name = "biston", cmd = "biston scan --focus-args", timeout_s = 60, max_output_lines = 80 },
    # staged files are appended: lints exactly the changed test files.
    { name = "zorilla", cmd = "zorilla check", timeout_s = 30, max_output_lines = 80 },
    # diffs the working tree against origin/main, walks ty's reference graph,
    # runs only the tests that reach the changed symbols; whole suite when unsure.
    { name = "gerenuk", cmd = "gerenuk run -- -q", pass_files = false, timeout_s = 120, max_output_lines = 120 },
]

[tool.biston.scan]
exclude = ["site/**", ".venv/**"]
