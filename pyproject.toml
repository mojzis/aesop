[project]
name = "aesop"
version = "0.1.0"
description = "Static portfolio site built with deedum"
requires-python = ">=3.14"
dependencies = [
    "deedum",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pyyaml>=6.0.3",
    "relnotes",
]

[dependency-groups]
dev = [
    "biston>=0.7.7",
    "gerenuk>=0.5.7",
    "introspy>=0.3.8",
    "madoqua>=0.2.12",
    "pycoati>=0.2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "ty-find>=0.5.5",
    "zorilla>=0.2.6",
]

[tool.deedum]
title = "aesop"
base_url = "https://mojzis.github.io"
base_path = "/aesop/"
description = "Fast CLI tools for agentic Python development. Each one teaches your agent how to use it."
author = "@mojzis"
favicon = "public/static/img/favicon.svg"
theme_color = "#1a1d21"
llms = true
app = "build.aesop:Aesop"
data = "content"
static = "public"
out = "site"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # staged files become --focus-args focus files: only clone pairs touching them are reported.
    { name = "biston", cmd = "biston scan --focus-args", timeout_s = 60, max_output_lines = 80 },
    # staged files are appended: lints exactly the changed test files.
    { name = "zorilla", cmd = "zorilla check", timeout_s = 30, max_output_lines = 80 },
    # diffs the working tree against origin/main, walks ty's reference graph,
    # runs only the tests that reach the changed symbols; whole suite when unsure.
    { name = "gerenuk", cmd = "gerenuk run -- -q", pass_files = false, timeout_s = 120, max_output_lines = 120 },
]

[tool.biston.scan]
exclude = ["site/**", ".venv/**", ".cache/**"]

[tool.uv.sources]
relnotes = { git = "https://github.com/mojzis/relnotes" }
deedum = { git = "https://github.com/mojzis/deedum" }
