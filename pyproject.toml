[project]
name = "aesop"
version = "0.1.0"
description = "Static portfolio site generated with Python + Jinja2"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[project.scripts]
build = "build.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
